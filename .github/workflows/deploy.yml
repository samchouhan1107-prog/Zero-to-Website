name: Deploy WebZoneBW Production

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "webzonebw-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

      - name: Verify build artifacts
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "❌ dist/index.html not found"
            exit 1
          fi
          echo "✅ Build artifacts verified"

      - name: Upload to GitHub Pages
        if: github.event_name == 'push' || github.event.inputs.environment == 'production'
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'
          name: production-build

  deploy-github-pages:
    if: github.event_name == 'push' || github.event.inputs.environment == 'production'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  test-deployment:
    runs-on: ubuntu-latest
    needs: [deploy-github-pages]

    steps:
      - name: Test deployment health
        run: |
          echo "🧪 Testing deployment health..."

          # Test GitHub Pages
          if curl -s https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ | grep -q "WebZoneBW"; then
            echo "✅ GitHub Pages deployment healthy"
          else
            echo "❌ GitHub Pages deployment failed"
            exit 1
          fi