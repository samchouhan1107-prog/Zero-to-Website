<!DOCTYPE html>
<html>
<head>
    <title>Server Test</title>
</head>
<body>
    <h1>Server Test</h1>
    <button onclick="testServer()">Test Server Connection</button>
    <div id="result"></div>

    <script>
        function testServer() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = 'Testing...';
            
            fetch('http://localhost:3007/test')
                .then(response => {
                    if (response.ok) {
                        return response.text();
                    } else {
                        throw new Error('Network response was not ok');
                    }
                })
                .then(data => {
                    resultDiv.innerHTML = '<strong style="color: green;">SUCCESS:</strong> ' + data;
                })
                .catch(error => {
                    resultDiv.innerHTML = '<strong style="color: red;">ERROR:</strong> ' + error.message;
                });
        }
    </script>
</body>
</html>
