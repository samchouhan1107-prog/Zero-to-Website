<!DOCTYPE html>
<html>
<head>
    <title>Test Server</title>
</head>
<body>
    <h1>Server Test</h1>
    <script>
        fetch('http://localhost:3000')
            .then(response => {
                console.log('Response:', response);
                document.body.innerHTML += '<p>Server responded with status: ' + response.status + '</p>';
            })
            .catch(error => {
                console.error('Error:', error);
                document.body.innerHTML += '<p>Error connecting to server: ' + error.message + '</p>';
            });
    </script>
</body>
</html>
