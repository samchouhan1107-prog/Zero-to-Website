<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    
    <!-- Breadcrumb Styles -->
    <style>
        /* Breadcrumb Variables */
        :root {
            --primary: #3b82f6;
            --primary-hover: #2563eb;
            --secondary: #8b5cf6;
            --accent: #10b981;
            --background: #0f172a;
            --surface: #1e293b;
            --surface-light: #334155;
            --surface-active: #475569;
            --text: #f8fafc;
            --text-muted: #94a3b8;
            --text-subtle: #64748b;
            --border: #475569;
            --border-light: #64748b;
            --success: #22c55e;
            --warning: #f59e0b;
            --error: #ef4444;
        }

        /* Breadcrumb Container */
        .breadcrumb-container {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 1rem 0;
        }

        .breadcrumb-content {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 1rem;
        }

        /* Breadcrumb Navigation */
        .breadcrumb-nav {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-wrap: wrap;
            font-size: 0.875rem;
        }

        .breadcrumb-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .breadcrumb-link {
            color: var(--text-muted);
            text-decoration: none;
            transition: color 0.2s ease;
            touch-action: manipulation;
        }

        .breadcrumb-link:hover {
            color: var(--primary);
        }

        .breadcrumb-link.active {
            color: var(--text);
            font-weight: 500;
        }

        .breadcrumb-separator {
            color: var(--text-subtle);
            margin: 0 0.25rem;
        }

        .breadcrumb-current {
            color: var(--text);
            font-weight: 500;
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            .breadcrumb-nav {
                font-size: 0.75rem;
            }
            
            .breadcrumb-item {
                gap: 0.25rem;
            }
        }

        @media (max-width: 480px) {
            .breadcrumb-container {
                padding: 0.5rem 0;
            }
        }
    </style>
</head>
<body>

    <!-- Breadcrumb Navigation -->
    <nav aria-label="Breadcrumb" class="breadcrumb-container">
        <div class="breadcrumb-content">
            <ol class="breadcrumb-nav" id="breadcrumbNav">
                <!-- Breadcrumb items will be dynamically generated by JavaScript -->
                <li class="breadcrumb-item">
                    <a href="/index.html" class="breadcrumb-link">Home</a>
                    <span class="breadcrumb-separator">›</span>
                </li>
                <li class="breadcrumb-item">
                    <span class="breadcrumb-current" id="currentPage">Current Page</span>
                </li>
            </ol>
        </div>
    </nav>

    <!-- Breadcrumb JavaScript -->
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Get current page information
            const currentPage = window.location.pathname.split('/').pop() || 'index.html';
            const pageNames = {
                'index.html': 'Home',
                'Workspace.html': 'Workspace',
                'webtools.html': 'Web Tools',
                'imagetools.html': 'Image Tools',
                'developertools.html': 'Developer Tools',
                'learn.html': 'Learn',
                'blog.html': 'Blog',
                'about.html': 'About',
                'contact.html': 'Contact',
                'privacy-policy.html': 'Privacy Policy',
                'terms-of-service.html': 'Terms of Service',
                'cookie-policy.html': 'Cookie Policy'
            };

            // Update breadcrumb
            const currentPageElement = document.getElementById('currentPage');
            const currentPageName = pageNames[currentPage] || currentPage.replace('.html', '');
            currentPageElement.textContent = currentPageName;

            // Set active state for current page
            const breadcrumbLinks = document.querySelectorAll('.breadcrumb-link');
            breadcrumbLinks.forEach(link => {
                const href = link.getAttribute('href');
                if (href && href.includes(currentPage)) {
                    link.classList.add('active');
                }
            });
        });
    </script>

</body>
</html>
