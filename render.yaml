services:
  - type: web
    name: webzonebw-api
    runtime: node
    plan: free
    buildCommand: npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGIN
        value: https://webzonebw.shop
      - key: GEMINI_API_KEY
        sync: false
      - key: VITE_API_URL
        value: https://webzonebw.shop/api