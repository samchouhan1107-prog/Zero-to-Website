<!DOCTYPE html>
<html lang="en" class="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes" />

    <!-- Google Fonts: Manrope (Headings) & Inter (Body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

    <!-- Primary SEO Meta Tags -->
    <title>Zero-to-Website — WebZoneBW SC | Editorial Web Engineering Platform</title>
    <meta name="description" content="Zero-to-Website by Sameer Chouhan / WebZoneBW: human-centred editorial web engineering platform with structured courses, free introductory lessons, interactive Live Code, and downloadable study packs." />
    <meta name="keywords" content="web developer tools, CSS flexbox visualizer, CSS grid tool, HTML editor, JavaScript Live Code, web development tutorial, responsive design tools, DOM inspector, frontend developer, learn web development" />
    <meta name="author" content="Sameer Chouhan / WebZoneBW" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <link rel="canonical" href="https://webzonebw.shop/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://webzonebw.shop/" />
    <meta property="og:title" content="Zero-to-Website — WebZoneBW SC | Editorial Web Engineering Platform" />
    <meta property="og:description" content="Turn your curiosity into practical skills with clear web engineering lessons, guided courses, and interactive Live Code practice." />
    <meta property="og:image" content="/assets/sclogo/logo_8c2b321c.png" />
    <meta property="og:site_name" content="WebZoneBW SC" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://webzonebw.shop/" />
    <meta name="twitter:title" content="Zero-to-Website — WebZoneBW SC | Editorial Web Engineering Platform" />
    <meta name="twitter:description" content="Turn your curiosity into practical skills with clear web engineering lessons, guided courses, and interactive Live Code practice." />
    <meta name="twitter:image" content="/assets/sclogo/logo_8c2b321c.png" />

    <!-- Minimal Critical CSS for Initial Loader Only -->
    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; }
      html.light body { background-color: #faf9f6; color: #1e293b; }
      html.dark body { background-color: #0b0c10; color: #e2e8f0; }

      .skip-link {
        position: absolute;
        top: -40px;
        left: 0;
        background: #0f172a;
        color: #ffffff;
        padding: 8px 12px;
        text-decoration: none;
        border-radius: 0 0 4px 0;
        z-index: 9999;
      }
      .skip-link:focus { top: 0; }

      .app-loader-spinner {
        display: inline-block;
        width: 24px;
        height: 24px;
        border: 3px solid rgba(124, 58, 237, 0.25);
        border-radius: 50%;
        border-top-color: #7c3aed;
        animation: appLoaderSpin 0.9s linear infinite;
      }
      @keyframes appLoaderSpin {
        to { transform: rotate(360deg); }
      }
    </style>

    <!-- Preconnect for Performance -->
    <link rel="preconnect" href="https://www.googletagmanager.com" />
    <link rel="preconnect" href="https://www.google-analytics.com" />

    <!-- Legal Disclosures -->
    <link rel="privacy-policy" href="https://webzonebw.shop/privacy-policy.html" />
    <link rel="terms-of-service" href="https://webzonebw.shop/terms-of-service.html" />
    <link rel="copyright" href="https://webzonebw.shop/about.html" />

    <!-- Favicons -->
    <link rel="icon" type="image/png" href="/assets/sclogo/logo_8c2b321c.png" />
    <link rel="apple-touch-icon" href="/assets/sclogo/logo_8c2b321c.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="sitemap" type="application/xml" title="Sitemap" href="/sitemap.xml" />
    <link rel="alternate" hreflang="en" href="https://webzonebw.shop/" />

    <!-- Schema.org JSON-LD Snippet -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "webzonebw.shop",
      "url": "https://webzonebw.shop"
    }
    </script>

    <!-- Structured Data: EducationalOrganization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "EducationalOrganization",
      "name": "WebZoneBW SC",
      "url": "https://webzonebw.shop",
      "description": "An interactive developer platform offering free web engineering tools, tutorials, and hands-on practice sandboxes.",
      "sameAs": [],
      "founder": {
        "@type": "Person",
        "name": "Sameer Chouhan"
      }
    }
    </script>

    <!-- Synchronize initial theme before paint (Soft Porcelain Light default) -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('zerotowebsite_theme');
          var root = document.documentElement;
          root.classList.remove('light', 'dark');
          root.classList.add(savedTheme === 'dark' ? 'dark' : 'light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a href="#main-content" class="skip-link">Skip to main content</a>

    <div id="root">
      <noscript>
        <section id="main-content" aria-labelledby="noscript-heading" style="max-width:800px;margin:40px auto;padding:20px;font-family:system-ui,sans-serif;color:#1e293b;">
          <h1 id="noscript-heading">Zero-to-Website — WebZoneBW SC</h1>
          <p>Turn your curiosity into practical skills. Explore clear lessons, useful ideas, and guided courses from beginner to confident creator.</p>
          <p>Published by Sameer Chouhan / WebZoneBW.</p>
        </section>
      </noscript>
    </div>

    <div id="loading" role="status" aria-label="Loading application" style="position:fixed;inset:0;background:var(--color-bg, #faf9f6);display:flex;align-items:center;justify-content:center;z-index:9999;pointer-events:none;">
      <div class="app-loader-spinner"></div>
    </div>

    <script>
      window.addEventListener('load', function() {
        var loading = document.getElementById('loading');
        if (loading) {
          loading.style.opacity = '0';
          loading.style.transition = 'opacity 0.25s ease';
          setTimeout(function() {
            loading.style.display = 'none';
          }, 250);
        }
      });
    </script>

    <script type="module" src="/src/utils/main.tsx"></script>
  </body>
</html>
